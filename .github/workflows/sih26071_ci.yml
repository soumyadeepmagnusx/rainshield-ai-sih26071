name: SIH26071 ML Pipeline, SQLite DB & Backend Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-sih26071-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RAINSHIELD-AI Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute ML Training & Holdout Validation Pipeline (2,400 Train + 400 Val Rows)
        run: python -m ml_pipeline.train_pipeline

      - name: Run Automated Backend, SQLite Database & CAP v1.2 Test Suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
